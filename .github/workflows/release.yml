name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            asset: invoice-renamer-linux-x86_64
            pyinstaller_name: invoice-renamer
          - os: windows-latest
            label: windows-x86_64
            asset: invoice-renamer-windows-x86_64.exe
            pyinstaller_name: invoice-renamer.exe
          - os: macos-14      # Apple Silicon
            label: macos-arm64
            asset: invoice-renamer-macos-arm64
            pyinstaller_name: invoice-renamer
          - os: macos-13      # Intel
            label: macos-x86_64
            asset: invoice-renamer-macos-x86_64
            pyinstaller_name: invoice-renamer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller invoice_renamer.spec --noconfirm --clean

      - name: Rename & package artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "dist/${{ matrix.pyinstaller_name }}" "${{ matrix.asset }}"
            7z a "out/${{ matrix.asset }}.zip" "${{ matrix.asset }}"
          else
            mv "dist/${{ matrix.pyinstaller_name }}" "${{ matrix.asset }}"
            chmod +x "${{ matrix.asset }}"
            tar -czf "out/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          fi

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          cd out
          if [ "${{ runner.os }}" = "Windows" ]; then
            sha256sum "${{ matrix.asset }}.zip" > "${{ matrix.asset }}.zip.sha256" || true
          else
            sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts for release
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
